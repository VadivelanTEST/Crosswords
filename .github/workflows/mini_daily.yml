name: Run Mini Blog Script Daily
on:
  # Scheduled publishing remains disabled until a genuine 5x5 Mini endpoint
  # has been verified and configured in the MINI_XWORDINFO_URL secret.
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  post-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m py_compile start.py start_mini.py
      - name: Run publisher validation tests
        run: python -m unittest discover -s tests -v
      - name: Publish verified NYT Mini
        if: github.event_name != 'pull_request'
        env:
          BLOGGER_FROM_EMAIL: ${{ secrets.BLOGGER_FROM_EMAIL }}
          BLOGGER_APP_PASSWORD: ${{ secrets.BLOGGER_APP_PASSWORD }}
          BLOGGER_TO_EMAIL: ${{ secrets.BLOGGER_TO_EMAIL }}
          MINI_XWORDINFO_URL: ${{ secrets.MINI_XWORDINFO_URL }}
        run: python start_mini.py
