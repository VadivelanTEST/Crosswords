name: Run Mini Blog Script Daily
on:
  # Scheduled publishing is intentionally disabled until a genuine 5x5 Mini
  # data endpoint is configured in the MINI_XWORDINFO_URL repository secret.
  workflow_dispatch:

jobs:
  post-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate script syntax
        run: python -m py_compile start_mini.py
      - name: Publish verified NYT Mini
        env:
          BLOGGER_FROM_EMAIL: ${{ secrets.BLOGGER_FROM_EMAIL }}
          BLOGGER_APP_PASSWORD: ${{ secrets.BLOGGER_APP_PASSWORD }}
          BLOGGER_TO_EMAIL: ${{ secrets.BLOGGER_TO_EMAIL }}
          MINI_XWORDINFO_URL: ${{ secrets.MINI_XWORDINFO_URL }}
        run: python start_mini.py
