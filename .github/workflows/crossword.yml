name: NYT Crossword Processor

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  
  # Allow manual triggering from GitHub UI
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Override start date (YYYY-MM-DD)'
        required: false
        default: ''
      test_mode:
        description: 'Test mode (only process one date)'
        type: boolean
        default: false
  
  # Also run on pushes to main for testing
  push:
    branches: [ main, master ]
    paths: 
      - 'crossword_processor.py'
      - '.github/workflows/crossword.yml'

jobs:
  process-crossword:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Python script
      env:
        BLOGGER_API_TOKEN: ${{ secrets.BLOGGER_API_TOKEN }}
        BLOG_ID: ${{ secrets.BLOG_ID }}
      run: |
        python crossword_processor.py
