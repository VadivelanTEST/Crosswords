name: NYT Crossword Processor

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  
  # Allow manual triggering from GitHub UI
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Override start date (YYYY-MM-DD)'
        required: false
        default: ''
      test_mode:
        description: 'Test mode (only process one date)'
        type: boolean
        default: false
  
  # Also run on pushes to main for testing
  push:
    branches: [ main, master ]
    paths: 
      - 'crossword_processor.py'
      - '.github/workflows/crossword.yml'

jobs:
  process-crossword:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # Prevent hanging jobs
    
    permissions:
      contents: write       # Required to commit progress file
      actions: read        # Required for actions
      metadata: read       # Required for metadata
    
    env:
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      PROGRESS_FILE: crossword_progress.txt
      
    steps:
    - name: 🚀 Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'
        
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests nltk
        echo "✅ Dependencies installed successfully"
        
    - name: 🔍 Pre-run status check
      run: |
        echo "=================================================="
        echo "🔍 PRE-RUN STATUS CHECK"
        echo "=================================================="
        echo "📂 Working Directory: $(pwd)"
        echo "📋 Repository Contents:"
        ls -la
        echo ""
        echo "📄 Progress File Status:"
        if [ -f "$PROGRESS_FILE" ]; then
          echo "✅ Progress file exists"
          echo "📅 Current content: '$(cat $PROGRESS_FILE)'"
          echo "📊 File size: $(wc -c < $PROGRESS_FILE) bytes"
          echo "🕒 Last modified: $(stat -c %y $PROGRESS_FILE 2>/dev/null || stat -f %Sm $PROGRESS_FILE 2>/dev/null || echo 'Unknown')"
        else
          echo "⚠️  Progress file does not exist - will start from 1990-01-01"
        fi
        echo ""
        echo "🔧 Git Status:"
        git status --porcelain
        echo "🌳 Current branch: $(git branch --show-current)"
        echo "🔗 Remote URL: $(git remote get-url origin)"
        echo "=================================================="
        
    - name: 🎯 Run crossword processor
      id: process
      run: |
        echo "=================================================="
        echo "🎯 STARTING CROSSWORD PROCESSOR"
        echo "=================================================="
        
        # Check if secrets are available
        if [ -z "$EMAIL_USER" ] || [ -z "$EMAIL_PASS" ]; then
          echo "❌ ERROR: Email credentials not found in secrets!"
          echo "Please add EMAIL_USER and EMAIL_PASS to repository secrets"
          exit 1
        fi
        
        echo "✅ Email credentials found"
        echo "📧 Email user: ${EMAIL_USER:0:5}***@${EMAIL_USER##*@}"
        
        # Run the processor
        echo "🚀 Starting Python script..."
        if python crossword_processor.py; then
          echo "✅ Crossword processor completed successfully"
          echo "success=true" >> $GITHUB_OUTPUT
        else
          echo "❌ Crossword processor failed"
          echo "success=false" >> $GITHUB_OUTPUT
          exit 1
        fi
        
    - name: 📊 Post-run status check
      if: always()
      run: |
        echo "=================================================="
        echo "📊 POST-RUN STATUS CHECK"
        echo "=================================================="
        echo "📄 Progress File Status After Processing:"
        if [ -f "$PROGRESS_FILE" ]; then
          echo "✅ Progress file exists after processing"
          PROGRESS_CONTENT=$(cat $PROGRESS_FILE)
          echo "📅 New content: '$PROGRESS_CONTENT'"
          echo "📊 File size: $(wc -c < $PROGRESS_FILE) bytes"
          
          # Validate date format
          if [[ $PROGRESS_CONTENT =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "✅ Date format is valid: $PROGRESS_CONTENT"
            echo "next_date=$PROGRESS_CONTENT" >> $GITHUB_ENV
          else
            echo "❌ Invalid date format: $PROGRESS_CONTENT"
          fi
        else
          echo "❌ ERROR: Progress file was not created!"
        fi
        echo ""
        echo "🔧 Git Status After Processing:"
        git status --porcelain
        git diff --name-only
        echo "=================================================="
        
    - name: ⚙️ Configure Git
      run: |
        echo "⚙️ Configuring Git for automated commits..."
        git config --local user.email "noreply@github.com"
        git config --local user.name "Crossword Bot"
        git config --local push.default simple
        echo "✅ Git configured successfully"
        
    - name: 💾 Commit and push progress
      id: commit
      run: |
        echo "=================================================="
        echo "💾 COMMITTING PROGRESS"
        echo "=================================================="
        
        # Add the progress file
        if [ -f "$PROGRESS_FILE" ]; then
          git add "$PROGRESS_FILE"
          echo "✅ Progress file staged for commit"
        else
          echo "⚠️  No progress file to stage"
        fi
        
        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "ℹ️  No changes to commit - progress file unchanged"
          echo "committed=false" >> $GITHUB_OUTPUT
        else
          echo "📝 Changes detected, creating commit..."
          
          # Create commit message with current progress
          if [ -f "$PROGRESS_FILE" ]; then
            CURRENT_PROGRESS=$(cat $PROGRESS_FILE)
            COMMIT_MSG="🤖 Update crossword progress: $CURRENT_PROGRESS

#Automated update from GitHub Actions
- Date processed: $CURRENT_PROGRESS 
- Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
- Workflow: ${{ github.workflow }}
- Run: ${{ github.run_number }}"
          else
            COMMIT_MSG="🤖 Crossword processing attempt

Automated update from GitHub Actions
- Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
- Workflow: ${{ github.workflow }}
- Run: ${{ github.run_number }}"
          fi
          
          echo "📋 Commit message prepared"
          
          # Commit the changes
          if git commit -m "$COMMIT_MSG"; then
            echo "✅ Commit created successfully"
            
            # Push the changes
            echo "🚀 Pushing to remote repository..."
            if git push origin HEAD; then
              echo "✅ Push successful"
              echo "committed=true" >> $GITHUB_OUTPUT
            else
              echo "❌ Push failed"
              echo "committed=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          else
            echo "❌ Commit failed"
            echo "committed=false" >> $GITHUB_OUTPUT
            exit 1
          fi
        fi
        echo "=================================================="
        
    - name: 📈 Final summary
      if: always()
      run: |
        echo "=================================================="
        echo "📈 FINAL WORKFLOW SUMMARY"
        echo "=================================================="
        echo "🕒 Workflow completed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        echo "⏱️  Total runtime: ${{ github.event_name }} trigger"
        
        if [ -f "$PROGRESS_FILE" ]; then
          FINAL_PROGRESS=$(cat $PROGRESS_FILE)
          echo "📅 Final progress: $FINAL_PROGRESS"
          echo "➡️  Next run will process: $FINAL_PROGRESS"
          
          # Calculate some stats
          START_DATE="1990-01-01"
          CURRENT_DATE="$FINAL_PROGRESS"
          echo "📊 Processing Statistics:"
          echo "   🎯 Started from: $START_DATE"
          echo "   📍 Current position: $CURRENT_DATE"
        else
          echo "❌ No progress file found"
        fi
        
        echo ""
        echo "🔄 Processing Status:"
        echo "   ✨ Processor success: ${{ steps.process.outputs.success || 'unknown' }}"
        echo "   💾 Commit success: ${{ steps.commit.outputs.committed || 'unknown' }}"
        
        echo ""
        echo "⏰ Next scheduled run: Every 30 minutes"
        echo "🔧 Manual trigger: Available in Actions tab"
        echo "=================================================="
        
    - name: 🚨 Failure notification
      if: failure()
      run: |
        echo "=================================================="
        echo "🚨 WORKFLOW FAILED"
        echo "=================================================="
        echo "❌ The crossword processing workflow has failed"
        echo "🕒 Failure time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        echo "🔗 Check the workflow logs for details"
        echo "📧 Consider checking email credentials in secrets"
        echo "🌐 Verify crossword data source availability"
        echo "=================================================="

    - name: 🎉 Success notification  
      if: success()
      run: |
        echo "=================================================="
        echo "🎉 WORKFLOW COMPLETED SUCCESSFULLY"
        echo "=================================================="
        echo "✅ Crossword processing completed successfully"
        echo "🕒 Success time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        if [ -f "$PROGRESS_FILE" ]; then
          echo "📅 Progress updated to: $(cat $PROGRESS_FILE)"
        fi
        echo "⏰ Next run scheduled in 30 minutes"
        echo "=================================================="
