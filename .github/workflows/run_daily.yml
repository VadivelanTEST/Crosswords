name: Run Blogger Script Daily
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - adsense-fix

jobs:
  post-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m py_compile start.py start_mini.py
      - name: Run publisher validation tests
        run: python -m unittest discover -s tests -v
      - name: Publish verified daily crossword
        if: github.event_name != 'pull_request'
        env:
          BLOGGER_FROM_EMAIL: ${{ secrets.BLOGGER_FROM_EMAIL }}
          BLOGGER_APP_PASSWORD: ${{ secrets.BLOGGER_APP_PASSWORD }}
          BLOGGER_TO_EMAIL: ${{ secrets.BLOGGER_TO_EMAIL }}
        run: python start.py
