name: Run Blogger Script Daily
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  post-blog:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate script syntax
        run: python -m py_compile start.py
      - name: Publish verified daily crossword
        env:
          BLOGGER_FROM_EMAIL: ${{ secrets.BLOGGER_FROM_EMAIL }}
          BLOGGER_APP_PASSWORD: ${{ secrets.BLOGGER_APP_PASSWORD }}
          BLOGGER_TO_EMAIL: ${{ secrets.BLOGGER_TO_EMAIL }}
        run: python start.py
